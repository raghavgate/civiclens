# Render Blueprint: dashboard.render.com → New → Blueprint → pick this repo.
services:
  - type: web
    name: civiclens
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Without ANTHROPIC_API_KEY the app runs the offline extractive provider (quotes sources directly).
      # Add the key and CIVICLENS_MODEL later in the dashboard; the service restarts and uses Claude.
      - key: ANTHROPIC_API_KEY
        sync: false          # optional at first; never committed
      - key: CIVICLENS_MODEL
        sync: false          # the Claude model ID to use once a key is set
      - key: TRUST_PROXY
        value: "1"           # Render sits behind a proxy; rate limits use the client IP it forwards
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_QUESTION_CAP
        value: "500"
